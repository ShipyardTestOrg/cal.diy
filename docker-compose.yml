# Generated by curious
services:
  database:
    image: postgres:16
    volumes:
      - database-data:/var/lib/postgresql/data
    env_file:
      - ./.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} -h 127.0.0.1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    labels:
      shipyard.readiness.exec.command: '["pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} -h 127.0.0.1"]'
  redis:
    image: redis:7
    volumes:
      - redis-data:/data
    env_file:
      - ./.env
    ports:
      - ${REDIS_PORT:-6379}:6379
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli -h 127.0.0.1 ping | grep -q PONG
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    labels:
      shipyard.readiness.exec.command: '["redis-cli -h 127.0.0.1 ping | grep -q PONG"]'
  calcom:
    image: calcom.docker.scarf.sh/calcom/cal.diy
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_WEBAPP_URL: ${NEXT_PUBLIC_WEBAPP_URL}
        NEXT_PUBLIC_API_V2_URL: ${NEXT_PUBLIC_API_V2_URL}
        NEXT_PUBLIC_LICENSE_CONSENT: ${NEXT_PUBLIC_LICENSE_CONSENT}
        NEXT_PUBLIC_WEBSITE_TERMS_URL: ${NEXT_PUBLIC_WEBSITE_TERMS_URL}
        NEXT_PUBLIC_WEBSITE_PRIVACY_POLICY_URL: ${NEXT_PUBLIC_WEBSITE_PRIVACY_POLICY_URL}
        NEXT_PUBLIC_SINGLE_ORG_SLUG: ${NEXT_PUBLIC_SINGLE_ORG_SLUG}
        ORGANIZATIONS_ENABLED: ${ORGANIZATIONS_ENABLED}
        CALCOM_TELEMETRY_DISABLED: ${CALCOM_TELEMETRY_DISABLED}
        DATABASE_URL: ${DATABASE_URL}
        DATABASE_DIRECT_URL: ${DATABASE_URL}
        CSP_POLICY: ${CSP_POLICY}
    env_file:
      - ./.env
    ports:
      - 3000:3000
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${DATABASE_HOST}:5432/${POSTGRES_DB}
      DATABASE_DIRECT_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${DATABASE_HOST}:5432/${POSTGRES_DB}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: ${NEXT_PUBLIC_WEBAPP_URL}
      CALENDSO_ENCRYPTION_KEY: ${CALENDSO_ENCRYPTION_KEY}
      NEXT_PUBLIC_WEBAPP_URL: ${NEXT_PUBLIC_WEBAPP_URL}
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "require('http').get('http://127.0.0.1:3000/',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s
    labels:
      shipyard.route: /
      shipyard.primary-route: "true"
      shipyard.readiness.http.path: /
      shipyard.env.NEXT_PUBLIC_WEBAPP_URL: '${SHIPYARD_URL}'
      shipyard.env.NEXTAUTH_URL: '${SHIPYARD_URL}' 
  calcom-api:
    build:
      context: .
      dockerfile: apps/api/v2/Dockerfile
      args:
        DATABASE_URL: ${DATABASE_URL}
        DATABASE_DIRECT_URL: ${DATABASE_URL}
    env_file:
      - ./.env
    ports:
      - ${API_PORT:-5555}:${API_PORT:-5555}
    environment:
      NODE_ENV: ""
      API_PORT: "5555"
      API_URL: ${API_URL}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${DATABASE_HOST}:5432/${POSTGRES_DB}
      DATABASE_READ_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${DATABASE_HOST}:5432/${POSTGRES_DB}
      DATABASE_WRITE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${DATABASE_HOST}:5432/${POSTGRES_DB}
      DATABASE_DIRECT_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${DATABASE_HOST}:5432/${POSTGRES_DB}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      JWT_SECRET: ${JWT_SECRET}
      REDIS_URL: ${REDIS_URL}
      LOG_LEVEL: ${LOG_LEVEL}
      API_KEY_PREFIX: ${API_KEY_PREFIX}
      WEB_APP_URL: ${WEB_APP_URL}
      IS_E2E: ${IS_E2E:-false}
      REWRITE_API_V2_PREFIX: ${REWRITE_API_V2_PREFIX:-1}
      CALCOM_LICENSE_KEY: ${CALCOM_LICENSE_KEY}
      STRIPE_API_KEY: ${STRIPE_API_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      IS_TEAM_BILLING_ENABLED: ${IS_TEAM_BILLING_ENABLED:-false}
      AXIOM_DATASET: ${AXIOM_DATASET}
      AXIOM_TOKEN: ${AXIOM_TOKEN}
      LOGGER_BRIDGE_LOG_LEVEL: ${LOGGER_BRIDGE_LOG_LEVEL}
      DOCS_URL: ${DOCS_URL}
      GET_LICENSE_KEY_URL: ${GET_LICENSE_KEY_URL}
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "require('http').get('http://127.0.0.1:'+(process.env.API_PORT||5555)+'/',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s
    labels:
      shipyard.route: /api
      shipyard.readiness.http.path: /
  studio:
    image: calcom.docker.scarf.sh/calcom/cal.diy
    command: npx prisma studio
    env_file:
      - ./.env
    ports:
      - 5556:5555
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${DATABASE_HOST}:5432/${POSTGRES_DB}
      DATABASE_DIRECT_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${DATABASE_HOST}:5432/${POSTGRES_DB}
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "require('http').get('http://127.0.0.1:5555/',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    labels:
      shipyard.route: /
      shipyard.readiness.http.path: /
volumes:
  database-data:
    labels:
      shipyard.deploy.disk.size: 5Gi
  redis-data:
    labels:
      shipyard.deploy.disk.size: 1Gi
