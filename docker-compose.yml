# Generated by curious
services:
  database:
    image: postgres:16
    volumes:
      - database-data:/var/lib/postgresql/data
    env_file:
      - ./.env
    environment:
      POSTGRES_USER: unicorn_user
      POSTGRES_PASSWORD: magical_password
      POSTGRES_DB: calendso
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-unicorn_user} -d ${POSTGRES_DB:-calendso}
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    expose:
      - "5432"
  redis:
    image: redis:latest
    volumes:
      - redis-data:/data
    env_file:
      - ./.env
    ports:
      - ${REDIS_PORT:-6379}:6379
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
  calcom:
    image: calcom.docker.scarf.sh/calcom/cal.diy
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_WEBAPP_URL: ${NEXT_PUBLIC_WEBAPP_URL:-http://localhost:3000}
        NEXT_PUBLIC_API_V2_URL: ${NEXT_PUBLIC_API_V2_URL:-http://localhost:3004/api/v2}
        NEXT_PUBLIC_LICENSE_CONSENT: ${NEXT_PUBLIC_LICENSE_CONSENT}
        NEXT_PUBLIC_WEBSITE_TERMS_URL: ${NEXT_PUBLIC_WEBSITE_TERMS_URL}
        NEXT_PUBLIC_WEBSITE_PRIVACY_POLICY_URL: ${NEXT_PUBLIC_WEBSITE_PRIVACY_POLICY_URL}
        NEXT_PUBLIC_SINGLE_ORG_SLUG: ${NEXT_PUBLIC_SINGLE_ORG_SLUG}
        ORGANIZATIONS_ENABLED: ${ORGANIZATIONS_ENABLED}
        CALCOM_TELEMETRY_DISABLED: ${CALCOM_TELEMETRY_DISABLED:-1}
        NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
        CALENDSO_ENCRYPTION_KEY: ${CALENDSO_ENCRYPTION_KEY}
        DATABASE_URL: postgresql://${POSTGRES_USER:-unicorn_user}:${POSTGRES_PASSWORD:-magical_password}@${DATABASE_HOST:-database:5432}/${POSTGRES_DB:-calendso}
        DATABASE_DIRECT_URL: postgresql://${POSTGRES_USER:-unicorn_user}:${POSTGRES_PASSWORD:-magical_password}@${DATABASE_HOST:-database:5432}/${POSTGRES_DB:-calendso}
        CSP_POLICY: ${CSP_POLICY}
    env_file:
      - ./.env
    ports:
      - 3000:3000
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      NEXT_PUBLIC_WEBAPP_URL: http://localhost:3000
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      CALENDSO_ENCRYPTION_KEY: ${CALENDSO_ENCRYPTION_KEY}
      DATABASE_URL: postgresql://unicorn_user:magical_password@database:5432/calendso
      DATABASE_DIRECT_URL: postgresql://unicorn_user:magical_password@database:5432/calendso
    depends_on:
      database:
        condition: service_healthy
    labels:
      shipyard.route: /
      shipyard.primary-route: "true"
      shipyard.readiness.http.path: /
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - require('http').get('http://127.0.0.1:3000/',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
  calcom-api:
    build:
      context: .
      dockerfile: apps/api/v2/Dockerfile
      args:
        DATABASE_URL: postgresql://${POSTGRES_USER:-unicorn_user}:${POSTGRES_PASSWORD:-magical_password}@${DATABASE_HOST:-database:5432}/${POSTGRES_DB:-calendso}
        DATABASE_DIRECT_URL: postgresql://${POSTGRES_USER:-unicorn_user}:${POSTGRES_PASSWORD:-magical_password}@${DATABASE_HOST:-database:5432}/${POSTGRES_DB:-calendso}
    env_file:
      - ./.env
    ports:
      - 3004:${API_PORT:-80}
    environment:
      NODE_ENV: development
      API_PORT: "80"
      API_URL: http://localhost
      DATABASE_URL: postgresql://unicorn_user:magical_password@database:5432/calendso
      DATABASE_READ_URL: postgresql://unicorn_user:magical_password@database:5432/calendso
      DATABASE_WRITE_URL: postgresql://unicorn_user:magical_password@database:5432/calendso
      DATABASE_DIRECT_URL: postgresql://unicorn_user:magical_password@database:5432/calendso
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      JWT_SECRET: ${JWT_SECRET}
      REDIS_URL: redis://redis:6379
      LOG_LEVEL: ${LOG_LEVEL}
      API_KEY_PREFIX: cal_
      WEB_APP_URL: http://localhost:3000
      IS_E2E: "false"
      REWRITE_API_V2_PREFIX: "1"
      CALCOM_LICENSE_KEY: ${CALCOM_LICENSE_KEY}
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      STRIPE_API_KEY: ${STRIPE_API_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      STRIPE_PRICE_ID_STARTER: ${STRIPE_PRICE_ID_STARTER}
      STRIPE_PRICE_ID_STARTER_OVERAGE: ${STRIPE_PRICE_ID_STARTER_OVERAGE}
      STRIPE_PRICE_ID_ESSENTIALS: ${STRIPE_PRICE_ID_ESSENTIALS}
      STRIPE_PRICE_ID_ESSENTIALS_OVERAGE: ${STRIPE_PRICE_ID_ESSENTIALS_OVERAGE}
      STRIPE_PRICE_ID_ENTERPRISE: ${STRIPE_PRICE_ID_ENTERPRISE}
      STRIPE_PRICE_ID_ENTERPRISE_OVERAGE: ${STRIPE_PRICE_ID_ENTERPRISE_OVERAGE}
      STRIPE_TEAM_MONTHLY_PRICE_ID: ${STRIPE_TEAM_MONTHLY_PRICE_ID}
      IS_TEAM_BILLING_ENABLED: "false"
      AXIOM_DATASET: ${AXIOM_DATASET}
      AXIOM_TOKEN: ${AXIOM_TOKEN}
      LOGGER_BRIDGE_LOG_LEVEL: "1"
      DOCS_URL: ${DOCS_URL}
      GET_LICENSE_KEY_URL: ${GET_LICENSE_KEY_URL}
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    labels:
      shipyard.route: /api
      shipyard.readiness.http.path: /
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - require('http').get('http://127.0.0.1:'+(process.env.API_PORT||80)+'/',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
  studio:
    image: calcom.docker.scarf.sh/calcom/cal.diy
    command: npx prisma studio
    env_file:
      - ./.env
    ports:
      - 5555:5555
    environment:
      DATABASE_URL: postgresql://unicorn_user:magical_password@database:5432/calendso
      DATABASE_DIRECT_URL: postgresql://unicorn_user:magical_password@database:5432/calendso
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - require('http').get('http://127.0.0.1:5555/',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    labels:
      shipyard.route: /
      shipyard.readiness.http.path: /
volumes:
  database-data:
    labels:
      shipyard.deploy.disk.size: 5Gi
  redis-data:
    labels:
      shipyard.deploy.disk.size: 1Gi
