# Generated by curious
services:
  database:
    image: postgres:16
    volumes:
      - database-data:/var/lib/postgresql/data
    env_file:
      - ./.env
    environment:
      POSTGRES_USER: unicorn_user
      POSTGRES_PASSWORD: magical_password
      POSTGRES_DB: calendso
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} -h 127.0.0.1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    labels:
      shipyard.readiness.exec.command: '["pg_isready","-U","unicorn_user","-d","calendso","-h","127.0.0.1"]'
  redis:
    image: redis:7
    volumes:
      - redis-data:/data
    env_file:
      - ./.env
    ports:
      - 6379:6379
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli -h 127.0.0.1 ping | grep -q PONG
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    labels:
      shipyard.readiness.exec.command: '["redis-cli","-h","127.0.0.1","ping"]'
  calcom:
    image: calcom/cal.com:latest
    env_file:
      - ./.env
    ports:
      - 3000:3000
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://unicorn_user:magical_password@database:5432/calendso
      DATABASE_DIRECT_URL: postgresql://unicorn_user:magical_password@database:5432/calendso
      NEXTAUTH_SECRET: 1mThquGhN4c3VwyVP6b1ASuakI/VUZerSutlutKpnkM=
      NEXTAUTH_URL: http://localhost:3000
      CALENDSO_ENCRYPTION_KEY: 6Cg9u8kUR22hMZcKBEt4HEa4kGfAZ786
      NEXT_PUBLIC_WEBAPP_URL: http://localhost:3000
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "require('http').get('http://127.0.0.1:3000/',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s
    labels:
      shipyard.route: /
      shipyard.primary-route: "true"
      shipyard.readiness.http.path: /
      shipyard.env.NEXT_PUBLIC_WEBAPP_URL: '${SHIPYARD_URL}'
      shipyard.env.NEXTAUTH_URL: '${SHIPYARD_URL}' 

volumes:
  database-data:
    labels:
      shipyard.deploy.disk.size: 5Gi
  redis-data:
    labels:
      shipyard.deploy.disk.size: 1Gi
